<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Intelligent PDF comparison tool with dual-pipeline technology for accurate document analysis" />
    <meta name="theme-color" content="#667eea" />
    <title>PDF Comparison - Intelligent Document Analysis</title>
    
    <!-- Google Fonts - Loaded asynchronously, won't block page render -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link 
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" 
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    </noscript>
    
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      
      html {
        scroll-behavior: smooth;
      }
      
      body {
        margin: 0;
        font-family: var(--font-family, 'Inter'), -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        font-feature-settings: 'kern' 1, 'liga' 1;
        line-height: 1.6;
        color: #212529;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }
      
      /* Selection colors */
      ::selection {
        background: rgba(102, 126, 234, 0.3);
        color: #212529;
      }
      
      ::-moz-selection {
        background: rgba(102, 126, 234, 0.3);
        color: #212529;
      }
      
      /* Focus visible for accessibility */
      *:focus-visible {
        outline: 3px solid #667eea;
        outline-offset: 2px;
      }
      
      /* Loading screen */
      #root:empty::before {
        content: '';
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 60px;
        height: 60px;
        border: 4px solid rgba(255, 255, 255, 0.2);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      
      #root:empty::after {
        content: 'Loading...';
        position: fixed;
        top: calc(50% + 60px);
        left: 50%;
        transform: translateX(-50%);
        color: white;
        font-weight: 600;
        font-size: 1.1rem;
        letter-spacing: 0.5px;
      }
      
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      
      /* Smooth transitions for all interactive elements */
      button, a, input, select, [role="button"] {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      
      /* Print styles */
      @media print {
        body {
          background: white !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
